name: Daily Stock Report Refresh

on:
  schedule:
    # 【主触发】每天 15:30 北京时间 (UTC+8 = 07:30 UTC), 仅工作日
    # ⚠️ 实测 GitHub Actions schedule 存在 4.8~8.8 小时系统性排队延迟(289~528 分钟, 20/20 超过 4h),
    #    实际在 北京 20:19~00:18 才启动。故本 cron 定位为「晚场兜底」, 准点性由下述补偿 cron + WorkBuddy 定时任务保证。
    - cron: '30 7 * * 1-5'
    # 【补偿触发】每天 17:30 北京时间 (09:30 UTC), 与原 cron 错开 2 小时形成时间阶梯。
    #    若主 cron 因排队延迟/失败未产出当日数据, 本触发补上; 已产出则被「幂等守卫」跳过(不重复跑)。
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# 防并发: 同一时间仅保留一个刷新任务, 后触发的「排队等待」而非取消正在进行的。
# v2.44 保留 cancel-in-progress: false —— 配合双 cron + 幂等守卫使用:
#   触发 A 跑完并提交当日文件 → 触发 B 排队启动 → 守卫发现文件已存在 → 秒退(不重复跑)。
#   若改成 true 反而更差: A 被中途取消, B 从头重跑 40 分钟。故此处刻意保持 false。
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 【2026-10-21 调整 90→120】事故: run 39576745437 中 step2 耗时 78 分钟
    # (海外 runner 拉腾讯/东财 491只K线极慢), 后续 5 步仅 5 分钟, 却在
    # track_recommendations 阶段撞上 90 分钟硬超时被 cancelled → push 步骤被 skip,
    # 结果「数据已算出但没上线」。预算必须覆盖最坏情况: 78(step2)+10(stale退避)
    # +15(后续) ≈ 103 分钟。海外 runner 抓取腾讯/东财慢, 120 分钟仍会撞墙(10-23 三次
    # cancelled 实证)。提到 300 分钟留足余量; 真正可靠路径是本地 run_daily_local.sh 兜底。
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Fetch & Score & Generate Report
        id: build
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          LOG="refresh_log.txt"
          echo "=== Refresh started at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ===" > $LOG
          MAX_RETRIES=3
          RETRY_DELAY=30
          # 【2026-10-21 修复】数据新鲜度失败单独用更长退避。
          # 事故: 15:31 准点触发时个股行情已更新(亨通 51.45 -1.19%), 但上证指数日线
          #   仍停在上一交易日 → check_data_fresh 判 stale。原来与 fetch 共用 30s 退避,
          #   3 次尝试 3 分钟内全部打完(15:31/15:32/15:34) 即放弃, 当日 0 产出。
          #   收盘后指数日线接口有数分钟至十几分钟延迟, 必须给足窗口。
          # 现改为 5 分钟退避 × 3 次 = 最多等 10 分钟(15:31 触发 → 最晚 15:44 判定),
          #   job timeout 90 分钟, 余量充足; 真假日仍会在 10 分钟后干净失败。
          STALE_RETRY_DELAY=300
          SUCCESS=0

          # --- 幂等守卫 (防重复跑) ---
          # 背景: GitHub Actions schedule 存在 4.8~8.8 小时系统性排队延迟(实测 289~528 分钟),
          #       故改为「WorkBuddy 定时任务准点触发 workflow_dispatch」为主 + 原 schedule 兜底。
          #       两条触发路径可能同日先后到达 → 用当日数据文件是否已存在做去重:
          #       若当日 scored json 已提交(说明今日已刷新成功), 则本次直接跳过, 不再重复跑 15 分钟。
          BJ_TODAY=$(date -u -d '+8 hours' '+%Y-%m-%d')
          if [ -f "top200_scored_${BJ_TODAY}.json" ]; then
            echo "=== 今日($BJ_TODAY)数据已存在, 跳过重复刷新 ===" >> $LOG
            echo "skip=already_refreshed_today" >> $GITHUB_OUTPUT
            echo "result=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            echo "--- Attempt $ATTEMPT/$MAX_RETRIES ---" >> $LOG

            # Step 1: Fetch top200 data
            echo "[$(date -u '+%H:%M:%S')] Running fetch_top200_sina.py ..." >> $LOG
            if python3 fetch_top200_sina.py >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Fetch succeeded" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ❌ Fetch failed" >> $LOG
              [ $ATTEMPT -lt $MAX_RETRIES ] && sleep $RETRY_DELAY && continue
              break
            fi

            # Step 1.5: 数据新鲜度守卫（v2.47 P1-7）
            # 背景: 假日(09-25/10-01~07)与接口故障(09-10)日照常产出陈旧 scored json,
            #   污染 Rank IC 交易日对齐。指数日线日期 < 当日, 或价格与上一交易日
            #   ≥80% 相同 → 判定陈旧。
            #   可重试: 收盘后指数日线偶有数分钟至十几分钟延迟, 用 STALE_RETRY_DELAY
            #   (5 分钟) 退避重试, 最多等 10 分钟通常恢复;
            #   真假日则 3 次尝试后干净失败(不写评分数据), 由 17:30 补偿 cron 或
            #   次日任务兜底。延迟跨午夜的 run 同样会被拒 —— 宁可缺一天,
            #   不发布"数据日期≠发布日期"的错标报告(已知限制, 见 README)。
            echo "[$(date -u '+%H:%M:%S')] Running check_data_fresh.py ..." >> $LOG
            if python3 check_data_fresh.py >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Data freshness OK" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ❌ Stale/holiday data (attempt $ATTEMPT/$MAX_RETRIES)" >> $LOG
              echo "result=stale_data" >> $GITHUB_OUTPUT
              [ $ATTEMPT -lt $MAX_RETRIES ] && sleep $STALE_RETRY_DELAY && continue
              break
            fi

            # Step 2: Score and analyze
            INPUT_JSON="top500_all_a.json"
            if [ ! -f "$INPUT_JSON" ]; then
              echo "[$(date -u '+%H:%M:%S')] ❌ $INPUT_JSON not found" >> $LOG
              [ $ATTEMPT -lt $MAX_RETRIES ] && sleep $RETRY_DELAY && continue
              break
            fi

            echo "[$(date -u '+%H:%M:%S')] Running step2_stockscorer_v2.py ..." >> $LOG
            # 【2026-10-21 加超时保护】step2 是耗时大头(海外 runner 拉 491 只K线 + 财务,
            #   实测 78 分钟)。加 5400s(90min) 硬上限: 保证即使极端劣化也留出
            #   后续 6 步(AI评估/板块/组合/跟踪/因子/报告/push 约 15 分钟)的预算,
            #   避免重演 run 39576745437「算了 78 分钟却没推上去」。
            if timeout 5400 python3 step2_stockscorer_v2.py "$INPUT_JSON" >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Scoring succeeded" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ❌ Scoring failed/timeout(5400s)" >> $LOG
              [ $ATTEMPT -lt $MAX_RETRIES ] && sleep $RETRY_DELAY && continue
              break
            fi

            # Step 3: Locate scored JSON
            SCORED_JSON=$(ls -t top200_scored_*.json 2>/dev/null | grep -v "_watch_" | head -1)
            if [ -z "$SCORED_JSON" ]; then
              echo "[$(date -u '+%H:%M:%S')] ❌ No scored JSON found" >> $LOG
              [ $ATTEMPT -lt $MAX_RETRIES ] && sleep $RETRY_DELAY && continue
              break
            fi

            # Step 3.5: Generate AI assessment layer (auto by LLM, fallback to rule engine)
            echo "[$(date -u '+%H:%M:%S')] Running generate_ai_assessment.py ..." >> $LOG
            if python3 generate_ai_assessment.py "$SCORED_JSON" >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ AI assessment generated" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ AI assessment generation failed, continuing with fallback/last version" >> $LOG
            fi

            # Step 3.6: AI-augmented enhancement (v2.30 four-step logic)
            # ① AI 盘面点评/题材资金共识 (来自 ai_assessment.json)
            # ② 消息面/题材热度 = 0.7×AI + 0.3×算法
            # ③ 基本面 = 基础×0.6 + 业绩一阶导×0.2 + 业绩二阶导×0.2
            # ④ AI 关注方向 / 模型总结 注入报告
            # 说明: ai_assessment.json 由 generate_ai_assessment.py 每日收盘后自动生成(优先 LLM，失败则 fallback 规则引擎)。
            #       若仍缺失, enhance_scores.py 自动降级为仅基本面导数增强, 不阻断流水线。
            echo "[$(date -u '+%H:%M:%S')] Running enhance_scores.py (AI augmentation, four-step) ..." >> $LOG
            if python3 enhance_scores.py "$SCORED_JSON" ai_assessment.json >> $LOG 2>&1; then
              MODEL=$(grep -o '"model": *"[^"]*"' "$SCORED_JSON" | head -1 | sed 's/.*: *//; s/"//g')
              echo "[$(date -u '+%H:%M:%S')] ✅ Enhancement succeeded (model: ${MODEL:-v2.30})" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ Enhancement failed, report will use base scores" >> $LOG
            fi

            # Step 3.7: 板块动量(申万二级) — 抓全市场近90日K线, 自建等权板块指数, 算60/10日动量与排名
            echo "[$(date -u '+%H:%M:%S')] Running sector_momentum_daily.py ..." >> $LOG
            if python3 sector_momentum_daily.py >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Sector momentum computed" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ Sector momentum failed, skip sector dimension" >> $LOG
            fi

            # Step 3.8: 并入第五维 score_sector(权重0.12, 从题材维度切出), 默认 evidence 模式(回测证据方向)
            echo "[$(date -u '+%H:%M:%S')] Running apply_sector_momentum.py ..." >> $LOG
            if python3 apply_sector_momentum.py "$SCORED_JSON" --mode evidence >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Sector dimension merged (v2.40)" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ Sector merge failed, report will use v2.30 scores" >> $LOG
            fi

            # Step 3.9: 每日组合 — 板块60日动量规则(A: 动量 / B: 反转) + 评分选股
            echo "[$(date -u '+%H:%M:%S')] Running pick_portfolio.py ..." >> $LOG
            if python3 pick_portfolio.py "$SCORED_JSON" --top 10 --per-sector 3 --per-parent 2 >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Portfolio generated" >> $LOG
              python3 gen_portfolio_report.py >> $LOG 2>&1 || echo "⚠️ Portfolio report failed" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ Portfolio generation failed" >> $LOG
            fi

            # Step 3.95: 推荐跟踪快照 + T+N 收益回填 (P0-4)
            # ⚠️ 必须在 gen_report_top200.py 之前运行: 报告层会读取 recommendation_track.json
            #    渲染「📊 推荐跟踪 · 胜率验证」区块, 故需先记录当日快照并回填历史 T+N。
            echo "[$(date -u '+%H:%M:%S')] Running track_recommendations.py (snapshot + T+N backfill) ..." >> $LOG
            # 【2026-10-21 加超时保护】该步会回填历史 T+N 收益(需联网拉历史K线),
            #   实测在海外 runner 上曾挂住 7 分钟以上且零输出。若它卡死会挤占
            #   后续 gen_report/push 的预算(见 run 39576745437 被 90min 硬杀的教训)。
            #   设 600s 上限: 超时仅跳过跟踪(报告降级为上一快照), 不阻塞主线出稿推送。
            if timeout 600 python3 track_recommendations.py "$SCORED_JSON" >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Recommendation tracking updated" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ Recommendation tracking failed/timeout(600s), report will show last snapshot" >> $LOG
            fi

            # Step 3.96: 因子有效性评估 (Rank IC) → factor_ic.json + factor_history.json
            # 【研究层 · 与复盘层解耦（v3.0, 2026-10-13）】
            #   本步是因子回测(研究层)的唯一每日登记入口: 只做 IC 数据登记, 不影响当日评分/复盘逻辑。
            #   复盘层(run_local_review.sh finalize)已移除 factor_eval 调用 —— 两层各司其职。
            # ⚠️ 必须在 gen_report_top200.py 之前运行: 报告层渲染「📐 因子有效性评估」区块。
            #    因子历史逐日追加到 factor_history.json(随仓库分发), 本地首次可用
            #    `python3 factor_eval.py --bootstrap-from-git` 从 git 历史引导(Actions 无历史)。
            echo "[$(date -u '+%H:%M:%S')] Running factor_eval.py (Rank IC + daily weight re-estimation) ..." >> $LOG
            # 【v3.5.5 十维权重每日重估】--optimize-weights 每日走步验证:
            #   池内十维截面 < MIN_TRAIN(30) 时 OOS 观测不足 → 自动维持先验并刷新 fitted_at/scan 记录;
            #   满 30 且 OOS 复合 IC 优于先验 +0.005 才落档 IC 驱动权重(防过拟合纪律不变)。
            if python3 factor_eval.py --optimize-weights >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Factor IC + weight re-estimation updated" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ Factor IC evaluation failed, report will omit IC section" >> $LOG
            fi

            # Step 3.955: 多因子组合专项审计（v4.3，老大 2026-10-25 三项要求）
            #   必须在 factor_eval.py 之后：round15/round16 要读 factor_history.json（本步刚刷新）。
            #   必须在 gen_report_top200.py 之前：报告层「⏱ 持仓周期」区块读 audit_round15.json。
            #   必须在 pick_multifactor.py 之前：round15/16 不依赖 mf_pick，只依赖历史截面。
            #   失败不阻断主链（审计是研究层，不是决策产物），但会记 ⚠️。
            echo "[$(date -u '+%H:%M:%S')] Running audit_round15/16 (holding period + zone filter A/B) ..." >> $LOG
            if timeout 600 python3 audit_round15.py >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Holding-period backtest updated" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ audit_round15 failed/timeout, report holds stale holding-period block" >> $LOG
            fi
            if timeout 600 python3 audit_round16.py >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Zone-filter A/B comparison updated" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ audit_round16 failed/timeout, daily report may show stale table" >> $LOG
            fi

            # Step 3.957: 权重落地穿透审计（v4.3，round17）—— 回答「日报的权重/因子到底有没有应用到生产」
            #   老大 2026-10-25 提问「目前看只应用了部分」，穿透后确认三类断点：
            #     ① 权重维度没进 factor_eval.FACTORS → 日报从未单独评估（round17 发现 theme_neg/size 共 0.24）
            #     ② 权重维度没进 scored 数据 → total 静默少算（step2 代码已支持，但数据是旧版生成的）
            #     ③ 选池规则数据与配置不一致 → 页面用上一版口径出图
            #   三者都不报错、只让结果静默退化，故必须每日显式体检。
            # ⚠️ 必须在 factor_eval.py 之后：要读最新 factor_ic.json 的实际截面数。
            # ⚠️ 必须在 gen_report_top200.py 之前：报告层「⚠️ 权重未完全落地」披露条读 audit_round17.json。
            # ⚠️ 必须在 gen_factor_daily.py 之前：因子日报 6.5 节读同一份产物。
            #   失败不阻断主链，但会记 ⚠️；缺产物时报告层自动隐藏披露条（不留硬编码兜底）。
            echo "[$(date -u '+%H:%M:%S')] Running audit_round17 (weight/factor traceability) ..." >> $LOG
            if timeout 300 python3 audit_round17.py >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Weight traceability audit updated" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ audit_round17 failed, report hides the weight-coverage disclosure" >> $LOG
            fi

            # Step 3.958: 消息面/题材因子诊断审计（round18）—— 回答「区分度不足、得分趋同、只有科技股高分」
            #   诊断三类成因：① 打分机制（硬编码先验仅 4 取值 / AI 主题均值混合压平组内差 / 32% 零值率）
            #     ② 数据源偏差（iFinD 限流 + KNOWN_CATALYSTS 手工表 199 条科技集中）③ 行业失衡
            #   实证：行业内中性化后 score_theme h20 IC 从 -0.1076 塌到 -0.0328（70% 是行业代理）；
            #     score_news h1 反而全 lag 过 Bonferroni（+3.08~+3.68）→ 消息面可修复、题材须改造。
            # ⚠️ 必须在 factor_eval.py 之后：读 factor_history.json 全部截面与价格库。
            #   失败不阻断主链，但会记 ⚠️。
            echo "[$(date -u '+%H:%M:%S')] Running audit_round18 (news/theme factor diagnosis) ..." >> $LOG
            if timeout 600 python3 audit_round18.py >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ News/theme diagnosis updated" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ audit_round18 failed, news/theme diagnosis holds stale data" >> $LOG
            fi

            # Step 3.959: 替代因子选型实证（round19）——以外部近半年因子排名 CSV 为选型依据，
            #   池内复测量价类候选 + 财务类候选的复测障碍诊断 + score_size 口径复测。
            #   CSV 放在 /Users/yzreal/Downloads/（本地一次性输入，非每日产物）；
            #   文件缺失时 Part A 自动跳过，量价复测不受影响 → 失败不阻断主链。
            # ⚠️ 必须在 factor_eval.py 之后：读 factor_history.json 全部截面与价格库。
            echo "[$(date -u '+%H:%M:%S')] Running audit_round19 (replacement factor selection) ..." >> $LOG
            if timeout 600 python3 audit_round19.py >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Replacement factor selection updated" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ audit_round19 failed, replacement selection holds stale data" >> $LOG
            fi

            # Step 3.960: 五维架构重构可行性评估（round20）——维度冗余度 PCA + 各维 IC
            #   复算 + 反转块回填重测（修复 10-13 才入库的事故）+ 5 维族结构合并损益对比。
            # ⚠️ 必须在 factor_eval.py 之后：读 factor_history.json 全部截面与价格库。
            echo "[$(date -u '+%H:%M:%S')] Running audit_round20 (5-dim architecture feasibility) ..." >> $LOG
            if timeout 600 python3 audit_round20.py >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ 5-dim architecture feasibility updated" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ audit_round20 failed, architecture evaluation holds stale data" >> $LOG
            fi

            # Step 3.961: fund 拆分「质量因子25%+成长因子20%」可行性实证（老大 2026-10-25）
            #   16 子因子（ROE/ROIC/ROA/OCF-NI/收现比/应计/OCFG/盈利波动/毛利波动/负债率/商誉
            #   + 扣非增速/CAGR3/营收增速/单季环比/增速差分）从 EM 财务摘要缓存 point-in-time 回填，
            #   子因子 IC + 族得分 IC + 行业内中性化 + 相关性 + 7 个权重变体合并损益。
            # ⚠️ 必须在 factor_eval.py 之后：读 factor_history.json 全部截面与价格库。
            echo "[$(date -u '+%H:%M:%S')] Running audit_round21 (quality/growth split feasibility) ..." >> $LOG
            if timeout 900 python3 audit_round21.py >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Quality/growth split feasibility updated" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ audit_round21 failed, quality/growth split holds stale data" >> $LOG
            fi

            # Step 3.965: 多因子精选组合（≤10 只）+ 回测 → sector/mf_pick_<date>.json + mf_backtest.json
            # 【v3.9 新增】解决「候选组合 20 只无法执行」问题；权重由 factor_ic.json 证据反推，非手填。
            # 【v4.3 新增】只选当日现价落在买入区间内的个股（老大第 2 项要求）。
            #   买区由 gen_report_top200.build_trade_plan 同源推导（AST 抽取复用，不重写），
            #   因此页面展示的买区与选股判据必然一致。
            # ⚠️ 必须在 factor_eval.py 之后: 要读最新 factor_ic.json 的池内 IC 来推导权重。
            # ⚠️ 必须在 track_recommendations.py 之后: 报告层「动量路线低 IC 悖论」区块
            #    读 recommendation_track.json 的真实跟踪数据。
            # ⚠️ 必须在 gen_report_top200.py 之前: 报告层渲染「🧮 多因子精选组合」区块。
            echo "[$(date -u '+%H:%M:%S')] Running pick_multifactor.py + gen_mf_backtest.py ..." >> $LOG
            if python3 pick_multifactor.py "$SCORED_JSON" --top 10 >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Multifactor portfolio generated (in-zone only)" >> $LOG
              _MFOUT=$(ls -1 sector/mf_pick_*.json 2>/dev/null | sort | tail -1)
              if [ -n "$_MFOUT" ]; then cp "$_MFOUT" sector/mf_latest.json; fi
              if timeout 300 python3 gen_mf_backtest.py >> $LOG 2>&1; then
                echo "[$(date -u '+%H:%M:%S')] ✅ Multifactor backtest regenerated" >> $LOG
              else
                echo "[$(date -u '+%H:%M:%S')] ⚠️ Multifactor backtest failed/timeout, report may show stale table" >> $LOG
              fi
              # Step 3.965b: 组合产出后立刻核查「现价 vs 买入区间」（v4.3）
              #   选股层已做这道闸，这里做**独立复核**：万一 build_trade_plan 抽失败或
              #   数据异常导致过滤没生效，能在此发现而不是等老大在页面上发现。
              #   round14 默认自动探测最新 mf_pick_<date>.json，不写死日期。
              echo "[$(date -u '+%H:%M:%S')] Running audit_round14/14b (in-zone verification) ..." >> $LOG
              if timeout 300 python3 audit_round14.py >> $LOG 2>&1; then
                echo "[$(date -u '+%H:%M:%S')] ✅ In-zone verification done" >> $LOG
              else
                echo "[$(date -u '+%H:%M:%S')] ⚠️ audit_round14 failed, check mf_pick in-zone manually" >> $LOG
              fi
              if timeout 300 python3 audit_round14b.py >> $LOG 2>&1; then
                echo "[$(date -u '+%H:%M:%S')] ✅ Candidate pool zone distribution done" >> $LOG
              else
                echo "[$(date -u '+%H:%M:%S')] ⚠️ audit_round14b failed (non-blocking)" >> $LOG
              fi
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ Multifactor pick failed, report falls back to mf_latest.json" >> $LOG
            fi

            # Step 3.97: 链路自检 (v3.2) —— 把「静默降级」变成可见告警
            #   背景: 各步用 if 守护, 单步失败不中断 → 如十维总分未重算会被静默吞掉。
            #   本步不中断链路(仅记日志); 发现可疑会打印 ⚠️ 供排查。
            echo "[$(date -u '+%H:%M:%S')] Running selfcheck_pipeline.py ..." >> $LOG
            python3 selfcheck_pipeline.py "$SCORED_JSON" >> $LOG 2>&1 \
              || echo "[$(date -u '+%H:%M:%S')] ⚠️ selfcheck reported suspicious items (see log)" >> $LOG

            # Step 3.98: 每日 AI 焦点池 · 机器源（v3.4，替代已删除的观察池）
            #   机器源=东财人气榜/涨跌停池/强势股池(真实互联网接口, 单源失败降级);
            #   本地 AI 联网检索补充由 run_daily_focus.sh + Agent 另行注入(此步只出机器源)。
            #   ⚠️ 必须在 gen_report_top200.py 之前运行: 报告层渲染「🎯 每日 AI 焦点池」区块。
            echo "[$(date -u '+%H:%M:%S')] Running fetch_focus_list.py (AI focus pool, machine sources) ..." >> $LOG
            if python3 fetch_focus_list.py --date "$(date -u -d '+8 hours' '+%Y-%m-%d')" --top 40 --scored "$SCORED_JSON" >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ AI focus pool generated" >> $LOG
            else
              echo "[$(date -u '+%H:%M:%S')] ⚠️ AI focus pool failed, report will omit focus section" >> $LOG
            fi

            # Step 4: Generate HTML report
            echo "[$(date -u '+%H:%M:%S')] Running gen_report_top200.py ..." >> $LOG
            if python3 gen_report_top200.py "$SCORED_JSON" >> $LOG 2>&1; then
              echo "[$(date -u '+%H:%M:%S')] ✅ Report generation succeeded" >> $LOG
              # Copy latest report as index.html for GitHub Pages
              LATEST_HTML=$(ls -t top200_report_*.html 2>/dev/null | head -1)
              if [ -n "$LATEST_HTML" ]; then
                cp "$LATEST_HTML" index.html
                echo "[$(date -u '+%H:%M:%S')] ✅ Copied $LATEST_HTML → index.html" >> $LOG
              fi
              # Step 4.5: v4.0 因子日报（Markdown 存档，不上线）
              #   主页面已按老大指令「只呈现结论」，全部计算过程/证伪检验迁至本报告。
              #   失败不阻断主链（日报是底稿而非决策产物）。
              echo "[$(date -u '+%H:%M:%S')] Running gen_factor_daily.py ..." >> $LOG
              if python3 gen_factor_daily.py >> $LOG 2>&1; then
                echo "[$(date -u '+%H:%M:%S')] ✅ Factor daily report generated" >> $LOG
              else
                echo "[$(date -u '+%H:%M:%S')] ⚠️ Factor daily report failed (non-blocking)" >> $LOG
              fi
              SUCCESS=1
              break
            else
              echo "[$(date -u '+%H:%M:%S')] ❌ Report generation failed" >> $LOG
              [ $ATTEMPT -lt $MAX_RETRIES ] && sleep $RETRY_DELAY && continue
            fi
          done

          if [ $SUCCESS -eq 1 ]; then
            echo "[$(date -u '+%H:%M:%S')] ✅ All steps completed successfully" >> $LOG
            # H1: 分步耗时汇总(由 LOG 时间戳推导, 单步超预期 1.5 倍输出 WARNING)
            awk '
              /^\[[0-9]{2}:[0-9]{2}:[0-9]{2}\]/ {
                ts = substr($1, 2, 8); split(ts, t, ":");
                sec = t[1]*3600 + t[2]*60 + t[3];
                if (prev > 0 && sec > prev) printf "  %-52s %4ds\n", prevline, sec-prev;
                prevline = substr($0, 11, 52); prev = sec;
              }
              END { if (prev > 0) printf "  %-52s (end)\n", prevline }
            ' $LOG > /tmp/step_timing.txt || true
            echo "[$(date -u '+%H:%M:%S')] ⏱️ 分步耗时:" >> $LOG
            cat /tmp/step_timing.txt >> $LOG
            TOTAL=$(awk '/^\[[0-9:/ ]+\]/ {if(first=="")first=substr($1,2,8); last=substr($1,2,8)} END {split(first,a,":"); split(last,b,":"); print (b[1]*3600+b[2]*60+b[3])-(a[1]*3600+a[2]*60+a[3])}' $LOG)
            echo "[$(date -u '+%H:%M:%S')] ⏱️ 总耗时 ${TOTAL}s (timeout 90min)" >> $LOG
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "[$(date -u '+%H:%M:%S')] ❌ Failed after $MAX_RETRIES attempts" >> $LOG
            cat $LOG
            exit 1
          fi

      - name: Prune old files (keep only latest)
        if: steps.build.outputs.result == 'success'
        run: |
          # 保留策略: 报告HTML/组合/板块动量 各留最新1份; 主力池scored 留最新2份(评级变化追踪依赖上一份)
          KEEP_SCORED=2
          KEEP_OTHER=1
          prune_keep() {  # $1=glob  $2=保留份数
            local i=0 f
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              i=$((i+1))
              if [ $i -gt $2 ]; then rm -f "$f" && echo "prune: $f"; fi
            done < <(ls -1 $1 2>/dev/null | sort -r)
          }
          # 1) 主报告 HTML (保留最新1)
          prune_keep "top200_report_*.html" $KEEP_OTHER
          # 2) 主力池 scored (保留最新2)
          ls -1 top200_scored_[0-9]*.json 2>/dev/null | sort -r | awk -v k=$KEEP_SCORED 'NR>k' | xargs -r rm -f
          # 3) 组合 json / 组合报告 / 板块动量 (各保留最新1)
          prune_keep "sector/portfolio_[0-9]*.json" $KEEP_OTHER
          prune_keep "sector/portfolio_report_*.html" $KEEP_OTHER
          prune_keep "sector/sector_momentum_[0-9]*.json" $KEEP_OTHER
          # 3.5) 每日 AI 焦点池 (保留最新1)
          prune_keep "focus_pool_[0-9]*.json" $KEEP_OTHER
          # 3.6) v4.0 因子日报存档 (保留最近 30 份，供权重优化回溯)
          mkdir -p reports
          prune_keep "reports/factor_[0-9]*.md" 30
          #   日报的本地 HTML 预览不入库（老大要求「Markdown 存档，不上线」）
          rm -f reports/factor_[0-9]*.html 2>/dev/null || true
          # 3.7) v4.3 多因子审计产物（保留最近 2 份，供跨日对比）
          #   audit_round15/16 是持仓周期与买区过滤的每日实证底稿，
          #   报告层与因子日报都读它们 → 必须入库，否则线上页面拿不到数据。
          prune_keep "audit_round*.json" 2
          # 4) 清理备份/临时文件
          rm -f *.bak *.bak_* *.prebak 2>/dev/null || true
          echo "--- 保留后清单 ---"
          ls -1 top200_report_*.html top200_scored_[0-9]*.json 2>/dev/null
          du -sh .

      - name: Commit & Push updated report
        if: steps.build.outputs.result == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # refresh_log.txt 不再入库(改由 upload-artifact 保留30天), 避免仓库历史膨胀
          git add index.html top200_report_*.html
          git add -f top200_scored_*.json top500_all_a.json ai_assessment.json
          git add -f focus_pool_*.json
          git add -f recommendation_track.json
          git add -f factor_history.json factor_ic.json
          git add -f sector/sw_map.json sector/sector_momentum_latest.json sector/portfolio_*.json sector/portfolio_report_*.html
          # v3.9 多因子组合产物（*.json 被 gitignore，必须 -f）
          git add -f sector/mf_pick_*.json sector/mf_latest.json mf_backtest.json 2>/dev/null || true
          # 【v3.5.5】factor_weights.json 每日由 --optimize-weights 重估写入, 必须随链路推送
          git add -f factor_weights.json
          git add enhance_scores.py gen_report_top200.py generate_ai_assessment.py factor_eval.py
          # v4.0 因子日报生成器 + 每日存档（Markdown，不上线）
          git add gen_factor_daily.py 2>/dev/null || true
          git add -f reports/factor_*.md 2>/dev/null || true
          git add sector_momentum_daily.py apply_sector_momentum.py pick_portfolio.py gen_portfolio_report.py fetch_sw_map.py selfcheck_pipeline.py
          # v3.9 新增脚本
          git add pick_multifactor.py gen_mf_backtest.py backtest_multifactor.py 2>/dev/null || true
          # v4.3 新增脚本：多因子买区过滤 / 持仓周期回测（老大 2026-10-25 三项要求）
          # round18：消息面/题材因子诊断（区分度、行业失衡、替代因子实证）
          git add audit_round14.py audit_round14b.py audit_round15.py audit_round16.py \
                audit_round17.py audit_round18.py audit_round19.py audit_round20.py audit_round21.py selfcheck_pipeline.py 2>/dev/null || true
          # v4.3 审计产物（*.json 被 gitignore，必须 -f）：报告层与因子日报的数据源
          git add -f audit_round14.json audit_round14b.json audit_round15.json audit_round16.json \
                audit_round17.json audit_round18.json audit_round19.json audit_round20.json audit_round21.json 2>/dev/null || true
          # 记录 prune 产生的删除(仅限已跟踪的历史报告/评分/组合文件)
          git add -u top200_report_2026-*.html 2>/dev/null || true
          git add -Au -- top200_scored_*.json sector/portfolio_*.json sector/sector_momentum_*.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "auto: daily report refresh $(date -u '+%Y-%m-%d')"
          # 推送重试: 远端可能被并发写入 → 先 rebase 再重试, 最多 5 次
          # 注意: 用退出码判断(避免管道 tail 吞掉 git push 的返回码造成假成功)
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "✅ push succeeded (attempt $i)"
              break
            fi
            echo "⚠️ push failed (attempt $i), rebasing on origin/main..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; echo "rebase failed"; }
            sleep 5
          done

      - name: Upload refresh log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log-${{ github.run_number }}
          path: refresh_log.txt
          retention-days: 30
